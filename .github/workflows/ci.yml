name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests – PHP ${{ matrix.php }} / Statamic ${{ matrix.statamic }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: true
      matrix:
        php: ['8.3', '8.4']
        statamic: ['6']
        # The addon supports Statamic 5 until Statamic 7 lands. Statamic 5 caps
        # at Laravel 12, so this leg also covers the older Testbench/Laravel.
        include:
          - php: '8.3'
            statamic: '5'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sockets
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-statamic${{ matrix.statamic }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ matrix.php }}-statamic${{ matrix.statamic }}-

      - run: composer require "statamic/cms:^${{ matrix.statamic }}.0" --no-update --no-interaction

      - run: composer update --prefer-stable --prefer-dist --no-interaction

      - run: npm ci
        if: matrix.php == '8.4'

      - name: Run full CI
        if: matrix.php == '8.4'
        run: npm run ci

      - name: Run tests
        if: matrix.php == '8.3'
        run: npm test
